name: Release desktop apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos:
    name: Package macOS universal app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/openrcs-signing.p12"
          keychain_path="$RUNNER_TEMP/openrcs-signing.keychain-db"
          keychain_password="$(uuidgen)"

          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
      - name: Package and sign universal macOS app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash scripts/package-macos.sh "${{ inputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: artifacts/OpenRCS-${{ inputs.version }}-macos-universal.dmg
          if-no-files-found: error

  windows:
    name: Package Windows x64 app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained Windows app
        shell: pwsh
        run: |
          $publishDirectory = "artifacts/windows-x64"
          dotnet publish OpenRCS.Ui/OpenRCS.Ui.csproj --configuration Release --runtime win-x64 --self-contained true --output $publishDirectory
          Compress-Archive -Path "$publishDirectory/*" -DestinationPath "artifacts/OpenRCS-${{ inputs.version }}-win-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: artifacts/OpenRCS-${{ inputs.version }}-win-x64.zip
          if-no-files-found: error

  linux:
    name: Package Linux x64 app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained Linux app
        run: |
          publish_directory="artifacts/linux-x64"
          dotnet publish OpenRCS.Ui/OpenRCS.Ui.csproj --configuration Release --runtime linux-x64 --self-contained true --output "$publish_directory"
          tar -C "$publish_directory" -czf "artifacts/OpenRCS-${{ inputs.version }}-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: artifacts/OpenRCS-${{ inputs.version }}-linux-x64.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release and upload desktop artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v${{ inputs.version }}"
          release-assets/OpenRCS-${{ inputs.version }}-macos-universal.dmg
          release-assets/OpenRCS-${{ inputs.version }}-win-x64.zip
          release-assets/OpenRCS-${{ inputs.version }}-linux-x64.tar.gz
          --title "OpenRCS ${{ inputs.version }}"
          --generate-notes

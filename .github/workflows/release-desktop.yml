name: Release desktop apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 1.0.0
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  validate:
    name: Validate release inputs
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be a numeric major.minor.patch version, for example 1.0.0."
            exit 1
          fi

  macos:
    name: Package macOS universal app
    needs: validate
    runs-on: macos-14
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check optional macOS signing configuration
        run: |
          if [[ -n "$APPLE_CERTIFICATE_BASE64" || -n "$APPLE_SIGNING_IDENTITY" ]]; then
            if [[ -z "$APPLE_CERTIFICATE_BASE64" || -z "$APPLE_SIGNING_IDENTITY" ]]; then
              echo "::error::Set both APPLE_CERTIFICATE_BASE64 and APPLE_SIGNING_IDENTITY, or neither for an ad hoc build."
              exit 1
            fi
          fi
      - name: Import Developer ID certificate
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        run: |
          certificate_path="$RUNNER_TEMP/openrcs-signing.p12"
          keychain_path="$RUNNER_TEMP/openrcs-signing.keychain-db"
          keychain_password="$(uuidgen)"

          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
      - name: Build macOS DMG and PKG
        run: bash scripts/package-macos.sh "$RELEASE_VERSION"
      - name: Remove signing keychain
        if: always()
        run: |
          keychain_path="$RUNNER_TEMP/openrcs-signing.keychain-db"
          if [[ -f "$keychain_path" ]]; then
            security delete-keychain "$keychain_path"
          fi
          rm -f "$RUNNER_TEMP/openrcs-signing.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            artifacts/OpenRCS-${{ inputs.version }}-macos-universal.dmg
            artifacts/OpenRCS-${{ inputs.version }}-macos-universal.pkg
          if-no-files-found: error

  windows:
    name: Package Windows x64 app
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
      - name: Build Windows installer and portable archive
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            artifacts/OpenRCS-${{ inputs.version }}-win-x64-setup.exe
            artifacts/OpenRCS-${{ inputs.version }}-win-x64.zip
          if-no-files-found: error

  linux:
    name: Package Linux x64 app
    needs: validate
    # Build against the older glibc baseline for wider compatibility.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install native build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev libicu-dev libssl-dev dpkg-dev desktop-file-utils
      - name: Build Linux package and portable archive
        run: bash scripts/package-linux.sh "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            artifacts/OpenRCS-${{ inputs.version }}-linux-x64.deb
            artifacts/OpenRCS-${{ inputs.version }}-linux-x64.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [macos, windows, linux]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release and upload desktop artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$RELEASE_VERSION" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "OpenRCS $RELEASE_VERSION" \
            --generate-notes

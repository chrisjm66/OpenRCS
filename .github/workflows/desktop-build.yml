name: Build desktop app

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            rid: win-x64
          - name: macos-x64
            os: macos-13
            rid: osx-x64
          - name: macos-arm64
            os: macos-14
            rid: osx-arm64
          - name: linux-x64
            os: ubuntu-latest
            rid: linux-x64

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained app
        run: >-
          dotnet publish OpenRCS.Ui/OpenRCS.Ui.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output artifacts/${{ matrix.name }}
      - name: Upload ${{ matrix.name }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenRCS-${{ matrix.name }}
          path: artifacts/${{ matrix.name }}
          if-no-files-found: error
